<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f5f5f5;
        }
        .card {
            margin-top: 50px;
            padding: 30px;
            border-radius: 15px;
        }
        .error {
            color: red;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <h2 class="text-center mb-4">Student Registration</h2>
                <form id="registerForm" novalidate>
                    
                    <div class="mb-3">
                        <label for="name" class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="name" required>
                        <div class="error" id="nameError"></div>
                    </div>

                    <div class="mb-3">
                        <label for="phone" class="form-label">Phone Number</label>
                        <input type="tel" class="form-control" id="phone" pattern="[0-9]{10,15}" required>
                        <div class="error" id="phoneError"></div>
                    </div>

                    <!-- ✅ Password Field Added -->
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" minlength="6" required>
                        <div class="error" id="passwordError"></div>
                    </div>

                    <div class="mb-3">
                        <label for="university" class="form-label">University</label>
                        <select class="form-select" id="university" required>
                            <option value="">Select University</option>
                        </select>
                        <div class="error" id="universityError"></div>
                    </div>

                    <div class="mb-3">
                        <label for="faculty" class="form-label">Faculty</label>
                        <select class="form-select" id="faculty" required>
                            <option value="">Select Faculty</option>
                        </select>
                        <div class="error" id="facultyError"></div>
                    </div>

                    <div class="mb-3">
                        <label for="year" class="form-label">Academic Year</label>
                        <select class="form-select" id="year" required>
                            <option value="">Select Year</option>
                        </select>
                        <div class="error" id="yearError"></div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Register</button>
                    <p class="mt-3 text-center">Already registered? <a href="login.html">Login</a></p>

                </form>
            </div>
        </div>
    </div>
</div>

<script src="js/register.js"></script>

<script>
document.getElementById('registerForm').addEventListener('submit', function(e) {
    e.preventDefault();

    let isValid = true;

    const name = document.getElementById('name');
    const phone = document.getElementById('phone');
    const password = document.getElementById('password');
    const university = document.getElementById('university');
    const faculty = document.getElementById('faculty');
    const year = document.getElementById('year');

    // Clear old errors
    document.querySelectorAll('.error').forEach(el => el.textContent = '');

    if (!name.value.trim()) {
        document.getElementById('nameError').textContent = "Full name is required";
        isValid = false;
    }

    if (!phone.value.match(/^[0-9]{10,15}$/)) {
        document.getElementById('phoneError').textContent = "Enter valid phone number (10-15 digits)";
        isValid = false;
    }

    if (!password.value || password.value.length < 6) {
        document.getElementById('passwordError').textContent = "Password must be at least 6 characters";
        isValid = false;
    }

    if (!university.value) {
        document.getElementById('universityError').textContent = "Please select a university";
        isValid = false;
    }

    if (!faculty.value) {
        document.getElementById('facultyError').textContent = "Please select a faculty";
        isValid = false;
    }

    if (!year.value) {
        document.getElementById('yearError').textContent = "Please select academic year";
        isValid = false;
    }

    if (isValid) {
        this.submit(); // submit normally if valid
    }
});
</script>

</body>
</html>
